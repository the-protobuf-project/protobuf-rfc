name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Formatting is a gate, not a convenience: without it whichever editor
      # last opened a file decides how it wraps, and patches break underneath
      # whoever edits next.
      - name: Check Formatting
        run: buf format --diff --exit-code

      - name: Lint Protos
        run: buf lint

      - name: Build Descriptor Set
        run: buf build

      # Resolves buf.yaml deps itself, so googleapis and protovalidate are
      # available without a hand-built descriptor set. ignore-comment-disables
      # enforces CLAUDE.md rule 1: no rule may be disabled, including by an
      # inline comment inside a proto.
      - name: Lint API Design
        uses: the-protobuf-project/setup-google-api-linter@v1.0.0
        with:
          paths: protobuf/**/*.proto
          buf: true
          ignore-comment-disables: true
          output-format: github
          fail-on-error: true

      # Apache-2.0 requires no per-file notice, but a file that quietly
      # loses one is how a repository ends up ambiguously licensed.
      - name: Check License Headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -3 "$file" | grep -q 'SPDX-License-Identifier: Apache-2.0'; then
              echo "::error file=$file::missing SPDX-License-Identifier header"
              missing=1
            fi
          done < <(find protobuf -name '*.proto')
          if [ "$missing" -ne 0 ]; then
            echo "Add the two-line Apache-2.0 header above 'syntax'."
            exit 1
          fi
          echo "All protos carry an SPDX header."

      # CLAUDE.md rule 2. A file over the cap gets split, never compressed.
      - name: Check File Length Cap
        run: |
          over=0
          while IFS= read -r file; do
            lines=$(wc -l <"$file")
            if [ "$lines" -gt 200 ]; then
              echo "::error file=$file::$lines lines, over the 200-line cap"
              over=1
            fi
          done < <(find . -path ./gen -prune -o \( -name '*.proto' -o -name '*.md' \) -print)
          if [ "$over" -ne 0 ]; then
            echo "Split the files above; do not compress them."
            exit 1
          fi
          echo "All files within the 200-line cap."

  BreakingChange:
    name: Breaking Change
    # Pull requests only. On a push to main there is nothing meaningful to
    # compare against: the BSR module may not exist yet, and comparing main to
    # itself is vacuous.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Against the local checkout by commit SHA. Cloning the remote over
      # https needs credentials the job does not have on a private repository,
      # and a SHA resolves where a branch name may never have been fetched.
      - name: Compare Against Base Commit
        run: buf breaking --against ".git#ref=${{ github.event.pull_request.base.sha }}"

  GenerateAndBuild:
    name: Generate And Build (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Go
          - language: TypeScript
          - language: Python
          - language: Java
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Setup Go
        if: matrix.language == 'Go'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup Node
        if: matrix.language == 'TypeScript'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        if: matrix.language == 'Python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        if: matrix.language == 'Java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # TypeScript is generated from its own template because protoc-gen-es
      # emits relative imports for every dependency, so its output must be
      # self-contained. Go, Java and Python resolve dependencies through
      # published runtime packages instead.
      - name: Generate
        run: |
          buf generate
          buf generate --template buf.gen.ts.yaml --include-imports

      # Compile only. Nothing is run, packaged or published: the point is to
      # prove the schema produces code a consumer can build, which buf lint
      # cannot tell you.
      - name: Build Go
        if: matrix.language == 'Go'
        run: |
          cp sandbox/go/go.mod gen/go/go.mod
          cd gen/go
          GOFLAGS=-mod=mod go mod tidy
          go build ./...

      - name: Build TypeScript
        if: matrix.language == 'TypeScript'
        run: |
          cp sandbox/ts/package.json sandbox/ts/tsconfig.json gen/ts/
          cd gen/ts
          npm install --no-fund --no-audit
          npx tsc --noEmit

      - name: Build Python
        if: matrix.language == 'Python'
        run: |
          pip install --quiet -r sandbox/python/requirements.txt
          cd gen/python
          # Make the generated tree a regular package. Without __init__.py it
          # is only a namespace portion, and Python's import scan lets a
          # regular package named `protobuf` further down sys.path win over a
          # namespace portion at the front -- which is why importing
          # protobuf.rfc4519 failed while protobuf itself resolved.
          find protobuf -type d -exec touch {}/__init__.py \;
          # Importing every module exercises the descriptor pool, which is
          # where a bad schema actually fails. Compiling the files would not.
          python - <<'PY'
          import importlib, pathlib, sys
          sys.path.insert(0, ".")
          mods = sorted(
              p.with_suffix("").as_posix().replace("/", ".")
              for p in pathlib.Path("protobuf").rglob("*_pb2.py")
          )
          for m in mods:
              importlib.import_module(m)
          print(f"Imported {len(mods)} generated modules.")
          PY

      - name: Build Java
        if: matrix.language == 'Java'
        run: |
          cp sandbox/java/pom.xml gen/java/pom.xml
          cd gen/java
          mvn --quiet --batch-mode compile

  PublishModule:
    name: Publish Module
    needs: [Lint, GenerateAndBuild]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Skipped rather than failed when BUF_TOKEN is absent. Secrets cannot be
      # read in a job-level `if`, but job-level env can, so the guard is here.
      - name: Push To BSR
        if: env.BUF_TOKEN != ''
        uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          push: true
          # The module is created by hand in the BSR with the intended
          # visibility. Letting CI create it would make that choice silently
          # on the first green build.
          push_disable_create: true
