syntax = "proto3";

package protobuf.rfc7953.availability.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "protobuf/rfc7953/availability/v1/availability.proto";

option java_multiple_files = true;
option java_outer_classname = "MessagesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc7953.availability.v1";

// Request message for Availabilities.GetAvailability, AIP-131 <https://aip.dev/131>.
message GetAvailabilityRequest {
  // Name of the availability to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Availability",
    (buf.validate.field).string.pattern = "^calendars/[^/]+/availabilities/[^/]+$"
  ];
}

// Request message for Availabilities.ListAvailabilities, AIP-132 <https://aip.dev/132>.
message ListAvailabilitiesRequest {
  // Calendar whose availabilities to list, "calendars/{calendar}".
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "protobufrfc.dev/Availability",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];

  // Maximum availabilities to return. Defaults to 50, capped at 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListAvailabilitiesResponse.next_page_token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160 <https://aip.dev/160>.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Include soft-deleted availabilities in the result. AIP-164 <https://aip.dev/164>.
  bool show_deleted = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Availabilities.ListAvailabilities, AIP-132 <https://aip.dev/132>.
message ListAvailabilitiesResponse {
  // The availabilities on this page.
  repeated Availability availabilities = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for Availabilities.CreateAvailability, AIP-133 <https://aip.dev/133>.
message CreateAvailabilityRequest {
  // Calendar to create the availability in, "calendars/{calendar}".
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "protobufrfc.dev/Availability",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];

  // The availability to create.
  Availability availability = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last segment of the resource name. The
  // server generates one when empty.
  string availability_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Availabilities.UpdateAvailability, AIP-134 <https://aip.dev/134>.
message UpdateAvailabilityRequest {
  // The availability to update. Its name field identifies the resource.
  Availability availability = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Availabilities.DeleteAvailability, AIP-135 <https://aip.dev/135>.
message DeleteAvailabilityRequest {
  // Name of the availability to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Availability",
    (buf.validate.field).string.pattern = "^calendars/[^/]+/availabilities/[^/]+$"
  ];
}

// Request message for Availabilities.UndeleteAvailability, AIP-164 <https://aip.dev/164>.
message UndeleteAvailabilityRequest {
  // Name of the soft-deleted availability to restore.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Availability",
    (buf.validate.field).string.pattern = "^calendars/[^/]+/availabilities/[^/]+$"
  ];
}
