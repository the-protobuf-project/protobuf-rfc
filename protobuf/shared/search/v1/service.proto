syntax = "proto3";

package protobuf.shared.search.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "protobuf/shared/search/v1/messages.proto";

option java_multiple_files = true;
option java_outer_classname = "ServiceProto";
option java_package = "io.github.theprotobufproject.protobuf.shared.search.v1";

// Search finds resources across types by free text.
//
// One generic service keyed on `resource_type`, per rule 7. Searching applies
// to resources in general, and a per-resource search method would give a
// caller no way to ask one question of a Card and an Event at once -- which
// is the only thing this offers that AIP-160 filtering on each List method
// does not.
//
// When to use which, since the two overlap:
//
//   - Narrowing one known collection by a known field is List with a filter.
//     `ListCards(filter: 'keywords:"vip"')` is exact, needs no index, and
//     returns the resources themselves.
//   - Asking one question of several types, in words rather than field
//     comparisons, is this. It needs an index and returns names.
//
// No RFC behind it, which rule 5 requires be said plainly: this is a native
// capability living in `shared/` because a search surface is something an API
// of this shape is expected to have, not because the IETF specified one.
//
// What the schema does not decide.
//
// An index. This repository defines no server, and search is the one
// capability here that cannot be answered from the resources alone -- an
// implementer needs something maintaining an inverted index, and its
// freshness is theirs to state. Two consequences fall out of that and are
// worth a caller knowing: results may lag writes, and `total_size` may be
// absent. Returning names rather than resources makes the first survivable,
// because a re-fetch reads current state whatever the index believed.
//
// Ranking. `score` has no defined scale and is comparable only within one
// response; nothing here says what makes one match better than another.
service Search {
  // Searches resources by free text.
  //
  //   POST /v1/search:searchResources
  //   body: the request itself
  //
  // POST rather than GET despite being a read: a query and a page token can
  // both be long, and AIP-136 takes a body for a custom method rather than
  // encoding them in a query string.
  //
  // Safe and idempotent, though not deterministic across calls: an index
  // changes as resources do, so the same query may rank differently a moment
  // later. A caller paging through results should expect that and not treat
  // a page token as a stable cursor over a frozen set -- if it needs
  // stability, protobuf.shared.sync.v1 gives a position in a change history
  // and this does not.
  //
  //   INVALID_ARGUMENT   empty query, unknown resource_type, or page_size out of range
  //   PERMISSION_DENIED  caller may not search this collection
  //   UNAVAILABLE        the index is not reachable; retry with backoff
  //
  // Results are filtered to what the caller may read, so two callers running
  // one query legitimately see different results and different `total_size`.
  rpc SearchResources(SearchResourcesRequest) returns (SearchResourcesResponse) {
    option (google.api.http) = {
      post: "/v1/search:searchResources"
      body: "*"
    };
    option (google.api.method_signature) = "query";
  }
}
