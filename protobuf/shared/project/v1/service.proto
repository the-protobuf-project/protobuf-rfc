syntax = "proto3";

package protobuf.shared.project.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "protobuf/shared/project/v1/messages.proto";
import "protobuf/shared/project/v1/project.proto";

option java_multiple_files = true;
option java_outer_classname = "ServiceProto";
option java_package = "io.github.theprotobufproject.protobuf.shared.project.v1";

// Projects manages Project resources.
//
// Native: no RFC defines a project, and the reason this resource exists at
// all is argued in project.proto. The service itself is plain AIP-131..135
// plus AIP-164 undelete -- there is nothing standards-derived about it, which
// is why it lives under shared/ and not in an rfc*/ directory where the path
// alone would lend it authority it has not earned.
service Projects {
  // Retrieves one project.
  //
  //   GET /v1/{name=projects/*}
  //
  // Safe and idempotent. Returns the resource as stored; no field is computed
  // per-caller. Read the `etag` here and pass it back on update or delete to
  // make the write conditional.
  //
  //   NOT_FOUND          no such project, or it is soft-deleted and `show_deleted` was not set
  //   INVALID_ARGUMENT   name does not match projects/*
  //   PERMISSION_DENIED  caller may not read it
  rpc GetProject(GetProjectRequest) returns (Project) {
    option (google.api.http) = {get: "/v1/{name=projects/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists projects.
  //
  //   GET /v1/projects
  //
  // Paginated per AIP-158: pass `page_size` (defaults to 50, capped at 1000)
  // and the `next_page_token` from the previous response. An empty
  // `next_page_token` means the last page. Page tokens are opaque and may
  // expire; do not construct or store them.
  //
  // Filtering uses the AIP-160 expression language over the resource's own
  // fields. Results carry no guaranteed order.
  //
  //   INVALID_ARGUMENT   malformed filter, or page_size out of range
  //   PERMISSION_DENIED  caller may not list this collection
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (google.api.http) = {get: "/v1/projects"};
  }

  // Creates a project.
  //
  //   POST /v1/projects
  //   body: the project itself
  //
  // Server-assigned fields on the request body are ignored: `name`, `uid`,
  // `etag` and the timestamps are set by the server regardless of what is
  // sent. Supply `project_id` to choose the final path segment; leave it empty
  // and the server generates one.
  //
  // Not idempotent. Retrying after a timeout may create a second project;
  // supply `project_id` if the caller needs retry safety.
  //
  //   ALREADY_EXISTS     that project_id is taken
  //   INVALID_ARGUMENT   a field violates its buf.validate constraint
  //   PERMISSION_DENIED  caller may not create here
  rpc CreateProject(CreateProjectRequest) returns (Project) {
    option (google.api.http) = {
      post: "/v1/projects"
      body: "project"
    };
    option (google.api.method_signature) = "project,project_id";
  }

  // Updates a project.
  //
  //   PATCH /v1/{project.name=projects/*}
  //   body: the project itself
  //
  // A partial update: only fields named in `update_mask` are written. An
  // empty mask writes every mutable field, which will clear anything the
  // caller left unset -- pass a mask unless that is the intent. OUTPUT_ONLY
  // and IMMUTABLE fields are rejected rather than silently dropped.
  //
  // Idempotent. Pass the `etag` read from Get to make the write conditional.
  //
  //   NOT_FOUND          no such project
  //   ABORTED            etag does not match the stored resource
  //   INVALID_ARGUMENT   mask names an unknown or immutable field
  //   PERMISSION_DENIED  caller may not modify it
  rpc UpdateProject(UpdateProjectRequest) returns (Project) {
    option (google.api.http) = {
      patch: "/v1/{project.name=projects/*}"
      body: "project"
    };
    option (google.api.method_signature) = "project,update_mask";
  }

  // Deletes a project.
  //
  //   DELETE /v1/{name=projects/*}
  //
  // Soft delete: the project is marked deleted, disappears from List unless
  // `show_deleted` is set, and is purged at `expire_time`. Recover it with
  // Undelete before then.
  //
  // Idempotent in effect but not in reporting: a second delete returns
  // NOT_FOUND rather than succeeding silently.
  //
  //   NOT_FOUND          no such project
  //   ABORTED            etag does not match
  //   PERMISSION_DENIED  caller may not delete it
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=projects/*}"};
    option (google.api.method_signature) = "name";
  }

  // Restores a soft-deleted project.
  //
  //   POST /v1/{name=projects/*}:undelete
  //
  // Valid only before `expire_time`; after that the project is gone and this
  // returns NOT_FOUND. Clears `delete_time` and `expire_time` and returns the
  // project as it was.
  //
  //   NOT_FOUND          no such project, or already purged
  //   ALREADY_EXISTS     the project is not deleted
  //   PERMISSION_DENIED  caller may not restore it
  rpc UndeleteProject(UndeleteProjectRequest) returns (Project) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}
