syntax = "proto3";

package protobuf.shared.project.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "protobuf/shared/project/v1/types.proto";

option java_multiple_files = true;
option java_outer_classname = "ProjectProto";
option java_package = "io.github.theprotobufproject.protobuf.shared.project.v1";

// Project is a scope of work with a lifecycle.
//
// Native: no RFC defines it, and under the rules of this repository that
// demands a reason rather than a citation.
//
// The reason is that it is not a Group. A Group (RFC 4519 section 3.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.5>) answers
// *who belongs*, and its membership edges already carry a role. A Project
// answers *what work is scoped and when* -- it starts, it ends, it is paused
// or abandoned, and none of that has anywhere to live on a groupOfNames.
//
// The test applied before building it: if Project turned out to be a Group
// with a role, it would not exist, because Membership.role already covers
// that. It survives because of start_time, end_time and state, which are
// lifecycle rather than membership.
//
// Membership of a project is deliberately absent. If a project needs members,
// they are a Group referenced from here, not a second membership mechanism --
// two overlapping ways to say who belongs is worse than either alone.
message Project {
  option (google.api.resource) = {
    type: "protobufrfc.dev/Project"
    pattern: "projects/{project}"
    singular: "project"
    plural: "projects"
  };
  option (buf.validate.message).cel = {
    id: "project.end_after_start"
    message: "end_time must be later than start_time"
    expression:
      "!has(this.end_time) || !has(this.start_time) || "
      "this.end_time > this.start_time"
  };

  // Resource name, "projects/{project}".
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^projects/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Server-assigned unique id.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Human-readable label. Required: a project with no name is unusable in any
  // list, and there is no RFC here to say otherwise.
  string display_name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  // What the project is for.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];

  // Who owns it.
  //
  // Typed as any resource rather than a User, matching Membership.member.
  // An owner may be a person or a group, and naming
  // protobufrfc.dev/User here would make a native package depend on RFC 6350
  // for its meaning without gaining anything.
  string owner = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "*"
  ];

  // When work is scheduled to begin.
  google.protobuf.Timestamp start_time = 6 [(google.api.field_behavior) = OPTIONAL];

  // When work is scheduled to end.
  google.protobuf.Timestamp end_time = 7 [(google.api.field_behavior) = OPTIONAL];

  // Where the project is in its lifecycle.
  //
  // Named `state`, which AIP-216 permits only because it is OUTPUT_ONLY: the
  // server derives it from the dates and from explicit transitions, and a
  // client cannot set it directly.
  ProjectState state = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (buf.validate.field).enum.defined_only = true
  ];

  // Weak validator for optimistic concurrency, AIP-154. Pass it back in an
  // update or delete to make the write conditional.
  string etag = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the project was soft-deleted, unset while it is live. AIP-164.
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a soft-deleted project is purged for good. AIP-164.
  google.protobuf.Timestamp expire_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the project was created.
  google.protobuf.Timestamp create_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the project was last modified.
  google.protobuf.Timestamp update_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}
