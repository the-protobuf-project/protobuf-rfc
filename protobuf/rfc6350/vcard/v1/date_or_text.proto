syntax = "proto3";

package protobuf.rfc6350.vcard.v1;

import "google/type/date.proto";
import "google/type/datetime.proto";

option java_multiple_files = true;
option java_outer_classname = "DateOrTextProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc6350.vcard.v1";

// DateOrText is vCard's DATE-AND-OR-TIME value type, RFC 6350 section 4.3.4 <https://www.rfc-editor.org/rfc/rfc6350.html#section-4.3.4>,
// including the text alternative every property using it permits.
//
// Three branches because the RFC needs all three:
//
//   date       "19960415", and crucially "--0415" -- a birthday with no year,
//              which is the common case in an address book. google.type.Date
//              allows year 0 for exactly this; a Timestamp cannot express it.
//   date_time  "19531015T231000Z", when a time of day is recorded too.
//   text       "circa 1800". Section 6.2.5 <https://www.rfc-editor.org/rfc/rfc6350.html#section-6.2.5> explicitly permits resetting the
//              value to text, and a schema that drops it loses data a
//              conforming vCard is allowed to carry.
//
// Reference: RFC 6350 "vCard Format Specification", section 4.3.4.
// https://www.rfc-editor.org/rfc/rfc6350.html#section-4.3.4
message DateOrText {
  // Exactly one form.
  oneof value {
    // A calendar date. Year 0 means the year is not recorded.
    google.type.Date date = 1;

    // A date with a time of day.
    google.type.DateTime date_time = 2;

    // Free text, for a value no date can express.
    string text = 3;
  }
}
