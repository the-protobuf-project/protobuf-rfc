syntax = "proto3";

package protobuf.rfc6350.vcard.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "protobuf/rfc6350/vcard/v1/vcard.proto";

option java_multiple_files = true;
option java_outer_classname = "MessagesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc6350.vcard.v1";

// Request message for Vcards.GetVcard, AIP-131 <https://aip.dev/131>.
message GetVcardRequest {
  // Name of the vCard to retrieve, "vcards/{vcard}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "protobufrfc.dev/Vcard"}
  ];
}

// Request message for Vcards.ListVcards, AIP-132 <https://aip.dev/132>.
message ListVcardsRequest {
  // Maximum vCards to return. Defaults to 50, capped at 1000.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListVcardsResponse.next_page_token.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160 <https://aip.dev/160>.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Include soft-deleted vCards in the result. AIP-164 <https://aip.dev/164>.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Vcards.ListVcards, AIP-132 <https://aip.dev/132>.
message ListVcardsResponse {
  // The vCards on this page.
  repeated Vcard vcards = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for Vcards.CreateVcard, AIP-133 <https://aip.dev/133>.
message CreateVcardRequest {
  // The vCard to create.
  Vcard vcard = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last segment of the resource name. The
  // server generates one when empty.
  string vcard_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Vcards.UpdateVcard, AIP-134 <https://aip.dev/134>.
message UpdateVcardRequest {
  // The vCard to update. Its name field identifies the resource.
  Vcard vcard = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Vcards.DeleteVcard, AIP-135 <https://aip.dev/135>.
message DeleteVcardRequest {
  // Name of the vCard to delete, "vcards/{vcard}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "protobufrfc.dev/Vcard"}
  ];
}

// Request message for UndeleteVcard, AIP-164 <https://aip.dev/164>.
message UndeleteVcardRequest {
  // Name of the soft-deleted vCard to restore, "vcards/{vcard}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Vcard",
    (buf.validate.field).string.pattern = "^vcards/[^/]+$"
  ];
}
