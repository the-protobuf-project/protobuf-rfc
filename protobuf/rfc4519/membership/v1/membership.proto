syntax = "proto3";

package protobuf.rfc4519.membership.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "MembershipProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc4519.membership.v1";

// Membership is one entry's presence in a Group.
//
// This is the 'member' attribute of section 2.17 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.17> promoted to a resource. It
// exists because a membership carries attributes of its own -- at minimum a
// role -- and an attribute needs something to hang on.
//
// Section 3.6 offers 'groupOfUniqueNames' with 'uniqueMember' (section 2.40 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.40>),
// which appends an optional UID to the DN so a reused name does not silently
// inherit an old membership. The uid field below solves that problem more
// directly, so only 'member' is modelled.
//
// Reference: RFC 4519 "LDAP: Schema for User Applications", section 2.17.
// https://www.rfc-editor.org/rfc/rfc4519.html#section-2.17
message Membership {
  option (google.api.resource) = {
    type: "protobufrfc.dev/Membership"
    pattern: "ldapGroups/{ldap_group}/memberships/{membership}"
    singular: "membership"
    plural: "memberships"
  };

  // Resource name, "ldapGroups/{ldap_group}/memberships/{membership}".
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^ldapGroups/[^/]+/memberships/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Server-assigned unique id.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // 'member', section 2.17 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.17>. Any resource: section 3.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.5> types member as a
  // distinguished name, which in a directory may address a person, a group
  // or anything else with an entry.
  string member = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "*"
  ];

  // What the member does in the group, e.g. "owner", "approver".
  //
  // Native: RFC 4519 has no concept of a role within a group. It is here
  // because every real use of a group -- approvals, ownership, escalation --
  // needs to distinguish members, and the RFC's answer is a separate group
  // per role, which multiplies groups instead of describing them.
  string role = 4 [(google.api.field_behavior) = OPTIONAL];

  // When the membership was created.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the membership was last modified.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
  // update or delete to make the write conditional: if the resource changed
  // since it was read, the request fails instead of overwriting.
  string etag = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}
