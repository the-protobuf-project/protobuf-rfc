syntax = "proto3";

package protobuf.rfc4519.membership.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "protobuf/rfc4519/membership/v1/membership.proto";

option java_multiple_files = true;
option java_outer_classname = "MessagesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc4519.membership.v1";

// Request message for Memberships.GetMembership, AIP-131 <https://aip.dev/131>.
message GetMembershipRequest {
  // Name of the membership, "groups/{group}/memberships/{membership}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Membership",
    (buf.validate.field).string.pattern = "^groups/[^/]+/memberships/[^/]+$"
  ];
}

// Request message for Memberships.ListMemberships, AIP-132 <https://aip.dev/132>.
message ListMembershipsRequest {
  // Group whose memberships to list, "groups/{group}".
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "protobufrfc.dev/Membership",
    (buf.validate.field).string.pattern = "^groups/[^/]+$"
  ];

  // Maximum memberships to return. Defaults to 50, capped at 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListMembershipsResponse.next_page_token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160 <https://aip.dev/160>. Filtering on role is the common case.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Memberships.ListMemberships, AIP-132 <https://aip.dev/132>.
message ListMembershipsResponse {
  // The memberships on this page.
  repeated Membership memberships = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for Memberships.CreateMembership, AIP-133 <https://aip.dev/133>.
message CreateMembershipRequest {
  // Group to add the member to, "groups/{group}".
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "protobufrfc.dev/Membership",
    (buf.validate.field).string.pattern = "^groups/[^/]+$"
  ];

  // The membership to create.
  Membership membership = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last segment of the resource name. The
  // server generates one when empty.
  string membership_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Memberships.UpdateMembership, AIP-134 <https://aip.dev/134>.
message UpdateMembershipRequest {
  // The membership to update. Its name field identifies the resource. In
  // practice only role is mutable: changing member would make this a
  // different membership.
  Membership membership = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Memberships.DeleteMembership, AIP-135 <https://aip.dev/135>.
message DeleteMembershipRequest {
  // Name of the membership to revoke.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Membership",
    (buf.validate.field).string.pattern = "^groups/[^/]+/memberships/[^/]+$"
  ];
}
