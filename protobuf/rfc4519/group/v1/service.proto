syntax = "proto3";

package protobuf.rfc4519.group.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "protobuf/rfc4519/group/v1/ldap_group.proto";
import "protobuf/rfc4519/group/v1/messages.proto";

option java_multiple_files = true;
option java_outer_classname = "ServiceProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc4519.group.v1";

// LdapGroups manages the RFC 4519 'groupOfNames' object class, section 3.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.5>.
//
// Membership is a separate service in its own package. Splitting them puts a
// service boundary between a group and its members, so creating a group with
// members is two calls and is not atomic. That is the cost of one package per
// resource; callers that need both must tolerate a partially created group.
service LdapGroups {
  // Retrieves one group.
  //
  //   GET /v1/{name=ldapGroups/*}
  //
  // Safe and idempotent. Returns the resource as stored; no field is computed
  // per-caller. Read the `etag` here and pass it back on update or delete to
  // make the write conditional.
  //
  //   NOT_FOUND          no such group, or it is soft-deleted and `show_deleted` was not set
  //   INVALID_ARGUMENT   name does not match ldapGroups/*
  //   PERMISSION_DENIED  caller may not read it
  rpc GetLdapGroup(GetLdapGroupRequest) returns (LdapGroup) {
    option (google.api.http) = {get: "/v1/{name=ldapGroups/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists groups.
  //
  //   GET /v1/ldapGroups
  //
  // Paginated per AIP-158: pass `page_size` (defaults to 50, capped at 1000)
  // and the `next_page_token` from the previous response. An empty
  // `next_page_token` means the last page. Page tokens are opaque and may
  // expire; do not construct or store them.
  //
  // Filtering uses the AIP-160 expression language over the resource's own
  // fields. Results carry no guaranteed order.
  //
  //   INVALID_ARGUMENT   malformed filter, or page_size out of range
  //   PERMISSION_DENIED  caller may not list this collection
  rpc ListLdapGroups(ListLdapGroupsRequest) returns (ListLdapGroupsResponse) {
    option (google.api.http) = {get: "/v1/ldapGroups"};
  }

  // Creates a group.
  //
  //   POST /v1/ldapGroups
  //   body: the group itself
  //
  // Server-assigned fields on the request body are ignored: `name`, `uid`,
  // `etag` and the timestamps are set by the server regardless of what is
  // sent. Supply `ldap_group_id` to choose the final path segment; leave it empty
  // and the server generates one.
  //
  // Not idempotent. Retrying after a timeout may create a second group;
  // supply `ldap_group_id` if the caller needs retry safety.
  //
  //   ALREADY_EXISTS     that ldap_group_id is taken
  //   INVALID_ARGUMENT   a field violates its buf.validate constraint
  //   PERMISSION_DENIED  caller may not create here
  rpc CreateLdapGroup(CreateLdapGroupRequest) returns (LdapGroup) {
    option (google.api.http) = {
      post: "/v1/ldapGroups"
      body: "ldap_group"
    };
    option (google.api.method_signature) = "ldap_group,ldap_group_id";
  }

  // Updates a group.
  //
  //   PATCH /v1/{ldap_group.name=ldapGroups/*}
  //   body: the group itself
  //
  // A partial update: only fields named in `update_mask` are written. An
  // empty mask writes every mutable field, which will clear anything the
  // caller left unset -- pass a mask unless that is the intent. OUTPUT_ONLY
  // and IMMUTABLE fields are rejected rather than silently dropped.
  //
  // Idempotent. Pass the `etag` read from Get to make the write conditional.
  //
  //   NOT_FOUND          no such group
  //   ABORTED            etag does not match the stored resource
  //   INVALID_ARGUMENT   mask names an unknown or immutable field
  //   PERMISSION_DENIED  caller may not modify it
  rpc UpdateLdapGroup(UpdateLdapGroupRequest) returns (LdapGroup) {
    option (google.api.http) = {
      patch: "/v1/{ldap_group.name=ldapGroups/*}"
      body: "ldap_group"
    };
    option (google.api.method_signature) = "ldap_group,update_mask";
  }

  // Deletes a group.
  //
  //   DELETE /v1/{name=ldapGroups/*}
  //
  // Soft delete: the group is marked deleted, disappears from List unless
  // `show_deleted` is set, and is purged at `expire_time`. Recover it with
  // Undelete before then.
  //
  // Idempotent in effect but not in reporting: a second delete returns
  // NOT_FOUND rather than succeeding silently.
  //
  //   NOT_FOUND          no such group
  //   ABORTED            etag does not match
  //   FAILED_PRECONDITION  it still has children and `force` was not set
  //   PERMISSION_DENIED  caller may not delete it
  rpc DeleteLdapGroup(DeleteLdapGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=ldapGroups/*}"};
    option (google.api.method_signature) = "name";
  }

  // Restores a soft-deleted group.
  //
  //   POST /v1/{name=ldapGroups/*}:undelete
  //
  // Valid only before `expire_time`; after that the group is gone and this
  // returns NOT_FOUND. Clears `delete_time` and `expire_time` and returns the
  // group as it was.
  //
  //   NOT_FOUND          no such group, or already purged
  //   ALREADY_EXISTS     the group is not deleted
  //   PERMISSION_DENIED  caller may not restore it
  rpc UndeleteLdapGroup(UndeleteLdapGroupRequest) returns (LdapGroup) {
    option (google.api.http) = {
      post: "/v1/{name=ldapGroups/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}
