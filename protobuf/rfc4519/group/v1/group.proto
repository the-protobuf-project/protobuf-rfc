syntax = "proto3";

package protobuf.rfc4519.group.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "GroupProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc4519.group.v1";

// Group is the LDAP 'groupOfNames' object class, RFC 4519 section 3.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.5>.
//
// Section 3.5 makes 'member' a mandatory multi-valued attribute of the group
// itself. This model deliberately does not: membership is Membership, a
// resource of its own. A repeated string of DNs cannot carry a role, cannot
// be created or revoked independently, and cannot be listed with a page
// token. Externalising it is the difference between a group that records who
// is in it and one that can answer why.
//
// A consequence: 'member' is mandatory in the RFC and absent here, so a Group
// with no Membership is representable in this API and is not a valid
// groupOfNames entry.
//
// The rule for an exporter: refuse, not synthesise. Section 3.5 gives no
// value that could stand in for an absent member -- inventing one (the
// group's own DN, an owner, a sentinel) asserts a membership nothing in this
// model states, which misleads every LDAP consumer of the export more than
// an explicit error would. An exporter targeting LDAP MUST reject a Group
// with zero Memberships rather than emit an invalid or fabricated entry.
//
// Reference: RFC 4519 "LDAP: Schema for User Applications", section 3.5.
// https://www.rfc-editor.org/rfc/rfc4519.html#section-3.5
message Group {
  option (google.api.resource) = {
    type: "protobufrfc.dev/Group"
    pattern: "groups/{group}"
    singular: "group"
    plural: "groups"
  };

  // Resource name, "groups/{group}".
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^groups/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Server-assigned unique id.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // 'cn', section 2.3 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.3>. Mandatory per section 3.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.5>.
  repeated string display_names = 3 [(google.api.field_behavior) = REQUIRED];

  // 'description', section 2.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.5>.
  repeated string descriptions = 4 [(google.api.field_behavior) = OPTIONAL];

  // 'owner', section 2.21 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.21>. Distinguished names, opaque here.
  repeated string owners = 5 [(google.api.field_behavior) = OPTIONAL];

  // 'o', section 2.19 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.19>. Optional per section 3.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.5>: a groupOfNames need not
  // belong to an organization.
  string organization = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "protobufrfc.dev/Organization"
  ];

  // 'businessCategory', section 2.1 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.1>.
  repeated string business_categories = 7 [(google.api.field_behavior) = OPTIONAL];

  // When the group was created.
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the group was last modified.
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
  // update or delete to make the write conditional: if the resource changed
  // since it was read, the request fails instead of overwriting.
  string etag = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the group was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp delete_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a soft-deleted group is purged for good. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp expire_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}
