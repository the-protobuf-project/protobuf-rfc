syntax = "proto3";

package protobuf.rfc4519.organizational_unit.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "OrganizationalUnitProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc4519.organizational_unit.v1";

// OrganizationalUnit is the LDAP 'organizationalUnit' object class, RFC 4519
// section 3.11 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.11>.
//
// A flat resource, "organizationalUnits/{organizationalUnit}", not nested
// under Organization: section 3.11 defines MUST and MAY attributes and says
// nothing about DIT placement, so "organizations/{o}/organizationalUnits/{ou}"
// would assert a hierarchy the RFC does not require. Group faced the same
// question for its own optional 'o' reference and was built flat for the
// same reason -- this resource follows that precedent instead of inventing a
// new one.
//
// Attributes are repeated because LDAP attribute types are multi-valued by
// default. Section 3.11 lists twenty MAY attributes; the three modelled here
// -- description, businessCategory, seeAlso -- are the ones Organization
// already carries, kept identical rather than picking a different subset for
// two object classes whose optional attributes overlap this heavily.
//
// Reference: RFC 4519 "LDAP: Schema for User Applications", section 3.11.
// https://www.rfc-editor.org/rfc/rfc4519.html#section-3.11
message OrganizationalUnit {
  option (google.api.resource) = {
    type: "protobufrfc.dev/OrganizationalUnit"
    pattern: "organizationalUnits/{organizational_unit}"
    singular: "organizationalUnit"
    plural: "organizationalUnits"
  };

  // Resource name, "organizationalUnits/{organizationalUnit}".
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^organizationalUnits/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Server-assigned unique id.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // 'ou', section 2.20 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.20>. The only attribute section 3.11 <https://www.rfc-editor.org/rfc/rfc4519.html#section-3.11> makes mandatory.
  repeated string display_names = 3 [(google.api.field_behavior) = REQUIRED];

  // 'description', section 2.5 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.5>.
  repeated string descriptions = 4 [(google.api.field_behavior) = OPTIONAL];

  // 'businessCategory', section 2.1 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.1>.
  repeated string business_categories = 5 [(google.api.field_behavior) = OPTIONAL];

  // 'seeAlso', section 2.30 <https://www.rfc-editor.org/rfc/rfc4519.html#section-2.30>. Distinguished names of related entries, kept as
  // opaque strings: an LDAP DN is not a resource name and does not resolve
  // through this API.
  repeated string see_also = 6 [(google.api.field_behavior) = OPTIONAL];

  // The organization this unit belongs to.
  //
  // Native: section 3.11's MAY list has no 'o' attribute, unlike groupOfNames
  // -- organizationalUnit's placement under an organization is a DIT
  // convention, not a schema attribute. Left unset, this resource is
  // undiscoverable from its organization, which defeats the reason for
  // building it (see the plan's "the one that makes the hierarchy real"),
  // so the field exists despite having no RFC attribute behind it.
  string organization = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "protobufrfc.dev/Organization"
  ];

  // When the organizational unit was created.
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the organizational unit was last modified.
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
  // update or delete to make the write conditional: if the resource changed
  // since it was read, the request fails instead of overwriting.
  string etag = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the organizational unit was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp delete_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a soft-deleted organizational unit is purged for good. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp expire_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}
