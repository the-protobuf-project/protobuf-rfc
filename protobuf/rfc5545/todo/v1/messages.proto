syntax = "proto3";

package protobuf.rfc5545.todo.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "protobuf/rfc5545/todo/v1/todo.proto";

option java_multiple_files = true;
option java_outer_classname = "MessagesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc5545.todo.v1";

// Request message for Todos.GetTodo, AIP-131 <https://aip.dev/131>.
message GetTodoRequest {
  // Name of the todo to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Todo",
    (buf.validate.field).string.pattern = "^calendars/[^/]+/todos/[^/]+$"
  ];
}

// Request message for Todos.ListTodos, AIP-132 <https://aip.dev/132>.
message ListTodosRequest {
  // Calendar whose todos to list, "calendars/{calendar}".
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "protobufrfc.dev/Todo",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];

  // Maximum todos to return. Defaults to 50, capped at 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListTodosResponse.next_page_token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160 <https://aip.dev/160>.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Include soft-deleted todos in the result. AIP-164 <https://aip.dev/164>.
  bool show_deleted = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Todos.ListTodos, AIP-132 <https://aip.dev/132>.
message ListTodosResponse {
  // The todos on this page.
  repeated Todo todos = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for Todos.CreateTodo, AIP-133 <https://aip.dev/133>.
message CreateTodoRequest {
  // Calendar to create the todo in.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "protobufrfc.dev/Todo",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];

  // The todo to create.
  Todo todo = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last path segment. The server generates
  // one when empty.
  string todo_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Todos.UpdateTodo, AIP-134 <https://aip.dev/134>.
message UpdateTodoRequest {
  // The todo to update. Its name field identifies the resource.
  Todo todo = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Todos.DeleteTodo, AIP-135 <https://aip.dev/135>.
message DeleteTodoRequest {
  // Name of the todo to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Todo",
    (buf.validate.field).string.pattern = "^calendars/[^/]+/todos/[^/]+$"
  ];
}

// Request message for Todos.UndeleteTodo, AIP-164 <https://aip.dev/164>.
message UndeleteTodoRequest {
  // Name of the soft-deleted todo to restore.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Todo",
    (buf.validate.field).string.pattern = "^calendars/[^/]+/todos/[^/]+$"
  ];
}
