syntax = "proto3";

package protobuf.rfc5545.event.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/type/dayofweek.proto";

option java_multiple_files = true;
option java_outer_classname = "RecurrencePartsProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc5545.event.v1";

// WeekdayNum is one BYDAY entry, RFC 5545 section 3.3.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10>.
//
// Reference: RFC 5545 "Internet Calendaring and Scheduling Core Object Specification (iCalendar)", section 3.3.10.
// https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10
message WeekdayNum {
  // The day itself.
  //
  // google.type.DayOfWeek rather than an enum of our own. AIP-215 exempts
  // google.* from the cross-package ban, so this is the one kind of value
  // type that can be shared between packages instead of copied into each --
  // which matters the moment RRULE lands on Todo.
  google.type.DayOfWeek day = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // Which occurrence of that day, e.g. 1 for the first, -1 for the last.
  // Zero means every occurrence. Only meaningful when the rule's frequency
  // is monthly or yearly.
  int32 ordinal = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Frequency is the FREQ part of a recurrence rule, RFC 5545 section 3.3.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10>.
//
// Reference: RFC 5545 "Internet Calendaring and Scheduling Core Object Specification (iCalendar)", section 3.3.10.
// https://www.rfc-editor.org/rfc/rfc5545.html#section-3.3.10
enum Frequency {
  // Not specified. Invalid in a recurrence rule; FREQ is mandatory.
  FREQUENCY_UNSPECIFIED = 0;

  // Every second.
  FREQUENCY_SECONDLY = 1;

  // Every minute.
  FREQUENCY_MINUTELY = 2;

  // Every hour.
  FREQUENCY_HOURLY = 3;

  // Every day.
  FREQUENCY_DAILY = 4;

  // Every week.
  FREQUENCY_WEEKLY = 5;

  // Every month.
  FREQUENCY_MONTHLY = 6;

  // Every year.
  FREQUENCY_YEARLY = 7;
}
