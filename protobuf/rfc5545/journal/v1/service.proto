syntax = "proto3";

package protobuf.rfc5545.journal.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "protobuf/rfc5545/journal/v1/journal.proto";
import "protobuf/rfc5545/journal/v1/messages.proto";

option java_multiple_files = true;
option java_outer_classname = "ServiceProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc5545.journal.v1";

// Journals manages RFC 5545 journals as resources.
//
// The AIP-131..135 standard methods plus AIP-164 undelete, and nothing else.
// Serializing to a file is not a journal-specific concern -- that lives in
// protobuf.shared.interchange.v1.Interchange, which handles any resource type.
service Journals {
  // Retrieves one journal.
  //
  //   GET /v1/{name=calendars/*/journals/*}
  //
  // Safe and idempotent. Read the `etag` here and pass it back on update or
  // delete to make the write conditional.
  //
  //   NOT_FOUND          no such journal, or it is soft-deleted
  //   INVALID_ARGUMENT   name does not match calendars/*/journals/*
  //   PERMISSION_DENIED  caller may not read it
  rpc GetJournal(GetJournalRequest) returns (Journal) {
    option (google.api.http) = {get: "/v1/{name=calendars/*/journals/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists the journals of a calendar.
  //
  //   GET /v1/{parent=calendars/*}/journals
  //
  // Paginated per AIP-158: pass `page_size` (defaults to 50, capped at 1000)
  // and the `next_page_token` from the previous response. Page tokens are
  // opaque and may expire; do not construct or store them.
  //
  // Scoped to one calendar through `parent`; there is no cross-calendar
  // listing. Filtering uses AIP-160 over the resource's own fields.
  //
  //   INVALID_ARGUMENT   malformed filter, or page_size out of range
  //   PERMISSION_DENIED  caller may not list this collection
  rpc ListJournals(ListJournalsRequest) returns (ListJournalsResponse) {
    option (google.api.http) = {get: "/v1/{parent=calendars/*}/journals"};
    option (google.api.method_signature) = "parent";
  }

  // Creates a journal.
  //
  //   POST /v1/{parent=calendars/*}/journals
  //   body: the journal itself
  //
  // Server-assigned fields on the request body are ignored: `name`, `uid`,
  // `etag` and the timestamps are set by the server regardless. Supply
  // `journal_id` to choose the final path segment.
  //
  // Not idempotent. Retrying after a timeout may create a second journal;
  // supply `journal_id` if the caller needs retry safety.
  //
  //   ALREADY_EXISTS     that journal_id is taken
  //   INVALID_ARGUMENT   a field violates its buf.validate constraint
  //   PERMISSION_DENIED  caller may not create here
  rpc CreateJournal(CreateJournalRequest) returns (Journal) {
    option (google.api.http) = {
      post: "/v1/{parent=calendars/*}/journals"
      body: "journal"
    };
    option (google.api.method_signature) = "parent,journal,journal_id";
  }

  // Updates a journal.
  //
  //   PATCH /v1/{journal.name=calendars/*/journals/*}
  //   body: the journal itself
  //
  // A partial update: only fields named in `update_mask` are written. An
  // empty mask writes every mutable field, clearing anything the caller left
  // unset -- pass a mask unless that is the intent. OUTPUT_ONLY and IMMUTABLE
  // fields are rejected rather than silently dropped.
  //
  // Idempotent. Pass the `etag` read from Get to make the write conditional.
  //
  //   NOT_FOUND          no such journal
  //   ABORTED            etag does not match the stored resource
  //   INVALID_ARGUMENT   mask names an unknown or immutable field
  //   PERMISSION_DENIED  caller may not modify it
  rpc UpdateJournal(UpdateJournalRequest) returns (Journal) {
    option (google.api.http) = {
      patch: "/v1/{journal.name=calendars/*/journals/*}"
      body: "journal"
    };
    option (google.api.method_signature) = "journal,update_mask";
  }

  // Deletes a journal.
  //
  //   DELETE /v1/{name=calendars/*/journals/*}
  //
  // Soft delete: the journal is marked deleted, disappears from List unless
  // `show_deleted` is set, and is purged at `expire_time`. Recover it with
  // Undelete before then.
  //
  // Idempotent in effect but not in reporting: a second delete returns
  // NOT_FOUND rather than succeeding silently.
  //
  //   NOT_FOUND          no such journal
  //   ABORTED            etag does not match
  //   PERMISSION_DENIED  caller may not delete it
  rpc DeleteJournal(DeleteJournalRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=calendars/*/journals/*}"};
    option (google.api.method_signature) = "name";
  }

  // Restores a soft-deleted journal.
  //
  //   POST /v1/{name=calendars/*/journals/*}:undelete
  //
  // Valid only before `expire_time`; after that the journal is gone and this
  // returns NOT_FOUND. Clears `delete_time` and `expire_time`.
  //
  //   NOT_FOUND          no such journal, or already purged
  //   ALREADY_EXISTS     the journal is not deleted
  //   PERMISSION_DENIED  caller may not restore it
  rpc UndeleteJournal(UndeleteJournalRequest) returns (Journal) {
    option (google.api.http) = {
      post: "/v1/{name=calendars/*/journals/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}
