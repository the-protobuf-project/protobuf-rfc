syntax = "proto3";

package protobuf.rfc5545.journal.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "protobuf/rfc5545/journal/v1/journal.proto";

option java_multiple_files = true;
option java_outer_classname = "MessagesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc5545.journal.v1";

// Request message for Journals.GetJournal, AIP-131 <https://aip.dev/131>.
message GetJournalRequest {
  // Name of the journal to retrieve.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Journal",
    (buf.validate.field).string.pattern = "^calendars/[^/]+/journals/[^/]+$"
  ];
}

// Request message for Journals.ListJournals, AIP-132 <https://aip.dev/132>.
message ListJournalsRequest {
  // Calendar whose journals to list, "calendars/{calendar}".
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "protobufrfc.dev/Journal",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];

  // Maximum journals to return. Defaults to 50, capped at 1000.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListJournalsResponse.next_page_token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160 <https://aip.dev/160>.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Include soft-deleted journals in the result. AIP-164 <https://aip.dev/164>.
  bool show_deleted = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Journals.ListJournals, AIP-132 <https://aip.dev/132>.
message ListJournalsResponse {
  // The journals on this page.
  repeated Journal journals = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for Journals.CreateJournal, AIP-133 <https://aip.dev/133>.
message CreateJournalRequest {
  // Calendar to create the journal in.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "protobufrfc.dev/Journal",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];

  // The journal to create.
  Journal journal = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last path segment. The server generates
  // one when empty.
  string journal_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Journals.UpdateJournal, AIP-134 <https://aip.dev/134>.
message UpdateJournalRequest {
  // The journal to update. Its name field identifies the resource.
  Journal journal = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Journals.DeleteJournal, AIP-135 <https://aip.dev/135>.
message DeleteJournalRequest {
  // Name of the journal to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Journal",
    (buf.validate.field).string.pattern = "^calendars/[^/]+/journals/[^/]+$"
  ];
}

// Request message for Journals.UndeleteJournal, AIP-164 <https://aip.dev/164>.
message UndeleteJournalRequest {
  // Name of the soft-deleted journal to restore.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Journal",
    (buf.validate.field).string.pattern = "^calendars/[^/]+/journals/[^/]+$"
  ];
}
