syntax = "proto3";

package protobuf.rfc5545.calendar.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "protobuf/rfc5545/calendar/v1/calendar.proto";

option java_multiple_files = true;
option java_outer_classname = "MessagesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc5545.calendar.v1";

// Request message for Calendars.GetCalendar, AIP-131 <https://aip.dev/131>.
message GetCalendarRequest {
  // Name of the calendar to retrieve, "calendars/{calendar}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Calendar",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];
}

// Request message for Calendars.ListCalendars, AIP-132 <https://aip.dev/132>.
message ListCalendarsRequest {
  // Maximum calendars to return. Defaults to 50, capped at 1000.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListCalendarsResponse.next_page_token.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160 <https://aip.dev/160>.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Include soft-deleted calendars in the result. AIP-164 <https://aip.dev/164>.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Calendars.ListCalendars, AIP-132 <https://aip.dev/132>.
message ListCalendarsResponse {
  // The calendars on this page.
  repeated Calendar calendars = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for Calendars.CreateCalendar, AIP-133 <https://aip.dev/133>.
message CreateCalendarRequest {
  // The calendar to create.
  Calendar calendar = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last segment of the resource name. The
  // server generates one when empty.
  string calendar_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Calendars.UpdateCalendar, AIP-134 <https://aip.dev/134>.
message UpdateCalendarRequest {
  // The calendar to update. Its name field identifies the resource.
  Calendar calendar = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Calendars.DeleteCalendar, AIP-135 <https://aip.dev/135>.
message DeleteCalendarRequest {
  // Name of the calendar to delete, "calendars/{calendar}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Calendar",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];

  // Delete the calendar's events along with it.
  //
  // Required by AIP-135 <https://aip.dev/135> because Event is a child of Calendar. Without it the
  // request fails on a non-empty calendar, which is the safer default:
  // deleting a calendar silently destroying a year of events is not something
  // to do by omission.
  bool force = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Calendars.UndeleteCalendar, AIP-164 <https://aip.dev/164>.
message UndeleteCalendarRequest {
  // Name of the soft-deleted calendar to restore.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Calendar",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];
}
