syntax = "proto3";

package protobuf.rfc5545.calendar.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/type/interval.proto";
import "protobuf/rfc5545/calendar/v1/calendar.proto";

option java_multiple_files = true;
option java_outer_classname = "MessagesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc5545.calendar.v1";

// Request message for Calendars.GetCalendar, AIP-131 <https://aip.dev/131>.
message GetCalendarRequest {
  // Name of the calendar to retrieve, "calendars/{calendar}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Calendar",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];
}

// Request message for Calendars.ListCalendars, AIP-132 <https://aip.dev/132>.
message ListCalendarsRequest {
  // Maximum calendars to return. Defaults to 50, capped at 1000.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListCalendarsResponse.next_page_token.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160 <https://aip.dev/160>.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Include soft-deleted calendars in the result. AIP-164 <https://aip.dev/164>.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Calendars.ListCalendars, AIP-132 <https://aip.dev/132>.
message ListCalendarsResponse {
  // The calendars on this page.
  repeated Calendar calendars = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for Calendars.CreateCalendar, AIP-133 <https://aip.dev/133>.
message CreateCalendarRequest {
  // The calendar to create.
  Calendar calendar = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last segment of the resource name. The
  // server generates one when empty.
  string calendar_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Calendars.UpdateCalendar, AIP-134 <https://aip.dev/134>.
message UpdateCalendarRequest {
  // The calendar to update. Its name field identifies the resource.
  Calendar calendar = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Calendars.DeleteCalendar, AIP-135 <https://aip.dev/135>.
message DeleteCalendarRequest {
  // Name of the calendar to delete, "calendars/{calendar}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Calendar",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];

  // Delete the calendar's events along with it.
  //
  // Required by AIP-135 <https://aip.dev/135> because Event is a child of Calendar. Without it the
  // request fails on a non-empty calendar, which is the safer default:
  // deleting a calendar silently destroying a year of events is not something
  // to do by omission.
  bool force = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Calendars.UndeleteCalendar, AIP-164 <https://aip.dev/164>.
message UndeleteCalendarRequest {
  // Name of the soft-deleted calendar to restore.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Calendar",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];
}

// Request message for Calendars.QueryFreeBusy, RFC 4791 section 7.10 <https://www.rfc-editor.org/rfc/rfc4791.html#section-7.10> (the
// free-busy-query REPORT).
message QueryFreeBusyRequest {
  // The calendar to query, "calendars/{calendar}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Calendar",
    (buf.validate.field).string.pattern = "^calendars/[^/]+$"
  ];

  // The window to report busy periods within. Required, and both bounds with
  // it, for the same reason as ExpandEventRequest.window: an open-ended query
  // over every event ever scheduled has no sensible default.
  google.type.Interval window = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];
}

// Response message for Calendars.QueryFreeBusy.
message QueryFreeBusyResponse {
  // The busy periods found within the requested window. Free time is not
  // listed; its absence from this result is what "free" means.
  repeated FreeBusyPeriod periods = 1;
}

// FreeBusyPeriod is one interval from a free/busy query result, structurally
// what the FREEBUSY property, RFC 5545 section 3.8.4.3 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3>, carries -- but
// computed on demand from stored events, not itself stored. VFREEBUSY
// (section 3.6.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.4>) has no existence independent of the events it
// summarises, so this schema gives it no resource, only this query result.
//
// Reference: RFC 5545 "Internet Calendaring and Scheduling Core Object Specification (iCalendar)", section 3.8.4.3.
// https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.3
message FreeBusyPeriod {
  // The interval, half-open: busy_type applies from `start_time` up to but
  // not including `end_time`.
  google.type.Interval period = 1;

  // Why the interval is reported busy.
  BusyType busy_type = 2;
}

// BusyType is the FBTYPE parameter, RFC 5545 section 3.2.9 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.9>.
//
// Reference: RFC 5545 "Internet Calendaring and Scheduling Core Object Specification (iCalendar)", section 3.2.9.
// https://www.rfc-editor.org/rfc/rfc5545.html#section-3.2.9
enum BusyType {
  // Not specified. Absent from any FreeBusyPeriod this schema produces --
  // every period this API returns carries an explicit type.
  BUSY_TYPE_UNSPECIFIED = 0;

  // BUSY. The default FBTYPE when a source property does not state one.
  BUSY_TYPE_BUSY = 1;

  // BUSY-UNAVAILABLE. Busy, and the interval cannot be scheduled at all.
  BUSY_TYPE_BUSY_UNAVAILABLE = 2;

  // BUSY-TENTATIVE. Busy because of one or more tentatively scheduled events.
  BUSY_TYPE_BUSY_TENTATIVE = 3;

  // FREE. Included only if a server chooses to report explicit free gaps
  // rather than relying on absence from the result to mean free.
  BUSY_TYPE_FREE = 4;
}
