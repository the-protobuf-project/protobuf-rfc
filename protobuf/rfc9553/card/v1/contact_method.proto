syntax = "proto3";

package protobuf.rfc9553.card.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "protobuf/rfc9553/card/v1/types.proto";

option java_multiple_files = true;
option java_outer_classname = "ContactMethodProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc9553.card.v1";

// EmailAddress is one entry of the Card "emails" property, RFC 9553
// section 2.3.1 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.1>.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.3.1.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.1
message EmailAddress {
  // The address itself, section 2.3.1 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.1>. Mandatory.
  string address = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.email = true
  ];

  // When this address is used, section 2.3.1 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.1>.
  repeated Context contexts = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // Preference, section 1.5.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.3>. 1 is most preferred, 100 least.
  int32 pref = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // A human-readable label, section 1.5.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.2>, e.g. "invoices".
  string label = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Phone is one entry of the Card "phones" property, RFC 9553 section 2.3.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.3>.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.3.3.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.3
message Phone {
  // The number, section 2.3.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.3>. Mandatory.
  //
  // Free text or a "tel:" URI (RFC 3966 <https://www.rfc-editor.org/rfc/rfc3966.html>), not validated as either. Section
  // 2.3.3 permits both and puts no grammar on the text form, which is why
  // google.type.PhoneNumber was rejected for this schema -- it models E.164
  // plus short code and would reject a number the RFC allows.
  string number = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  // What the number can do, section 2.3.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.3>. Orthogonal to `contexts`:
  // a number may be both a work number and a fax.
  repeated PhoneFeature features = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // When this number is used, section 2.3.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.3>.
  repeated Context contexts = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // Preference, section 1.5.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.3>.
  int32 pref = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // A human-readable label, section 1.5.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.2>.
  string label = 5 [(google.api.field_behavior) = OPTIONAL];
}

// OnlineService is one entry of the Card "onlineServices" property, RFC 9553
// section 2.3.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.2>.
//
// A presence on a service -- a social profile, a messaging account. This is
// what RFC 9554 section 3.5 <https://www.rfc-editor.org/rfc/rfc9554.html#section-3.5>'s SOCIALPROFILE converts to, and it also
// absorbs vCard's IMPP (RFC 6350 section 6.4.3 <https://www.rfc-editor.org/rfc/rfc6350.html#section-6.4.3>): JSContact makes no
// distinction between a profile page and a messaging endpoint.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.3.2.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.2
message OnlineService {
  // The service's name as presented to users, section 2.3.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.2>,
  // e.g. "Mastodon". Free text: section 2.3.2 registers no value list.
  string service = 1 [(google.api.field_behavior) = OPTIONAL];

  // A URI for the account, section 2.3.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.2>.
  string uri = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.uri = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // The account name on that service, section 2.3.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.2>, for when the
  // URI does not contain it recoverably.
  //
  // Named `username`, not the RFC's `user`: a bare `user` reads as a
  // reference to a User resource, which this is not.
  string username = 3 [(google.api.field_behavior) = OPTIONAL];

  // When this account is used, section 2.3.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.2>.
  repeated Context contexts = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // Preference, section 1.5.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.3>.
  int32 pref = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // A human-readable label, section 1.5.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.2>.
  string label = 6 [(google.api.field_behavior) = OPTIONAL];
}

// LanguagePref is one entry of the Card "preferredLanguages" property,
// RFC 9553 section 2.3.4 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.4>.
//
// A language the contact prefers to be addressed in -- vCard's LANG,
// RFC 6350 section 6.4.4 <https://www.rfc-editor.org/rfc/rfc6350.html#section-6.4.4>. Distinct from Card.language, which says
// what language this Card's own text is written in.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.3.4.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.4
message LanguagePref {
  // A BCP 47 language tag, RFC 5646 <https://www.rfc-editor.org/rfc/rfc5646.html>, section 2.3.4 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.4>. Mandatory.
  //
  // Named `language_code` per AIP-143 <https://aip.dev/143>; the RFC calls it `language`.
  string language_code = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.min_len = 1
  ];

  // When this language is preferred, section 2.3.4 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.4>.
  repeated Context contexts = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // Preference, section 1.5.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.3>.
  int32 pref = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];
}

// PhoneFeature is a Phone "features" value, RFC 9553 section 2.3.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.3>.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.3.3.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.3
enum PhoneFeature {
  // Not specified.
  PHONE_FEATURE_UNSPECIFIED = 0;

  // A mobile phone.
  PHONE_FEATURE_MOBILE = 1;

  // Voice calls.
  PHONE_FEATURE_VOICE = 2;

  // Text messages (SMS).
  PHONE_FEATURE_TEXT = 3;

  // Video calls.
  PHONE_FEATURE_VIDEO = 4;

  // The main number for the entity, section 2.3.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.3.3>.
  PHONE_FEATURE_MAIN_NUMBER = 5;

  // A text telephone for hearing-impaired callers.
  PHONE_FEATURE_TEXTPHONE = 6;

  // Facsimile.
  PHONE_FEATURE_FAX = 7;

  // A paging device.
  PHONE_FEATURE_PAGER = 8;
}
