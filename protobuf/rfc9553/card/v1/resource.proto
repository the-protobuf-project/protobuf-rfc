syntax = "proto3";

package protobuf.rfc9553.card.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "protobuf/rfc9553/card/v1/types.proto";

option java_multiple_files = true;
option java_outer_classname = "ResourceProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc9553.card.v1";

// Link is one entry of the Card "links" property, RFC 9553 section 2.6.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.3>.
//
// vCard's URL, RFC 6350 section 6.7.8 <https://www.rfc-editor.org/rfc/rfc6350.html#section-6.7.8>.
//
// Section 2.6 defines four resource properties -- links, media, cryptoKeys,
// directories -- that share a shape: kind, uri, mediaType, contexts, pref,
// label. They are four messages rather than one with a discriminator because
// each occupies its own Card property and carries its own `kind` value set,
// so a single type would have to accept kinds that are invalid for where it
// sits.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.6.3.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.3
message Link {
  // The URI, section 2.6.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.3>. Mandatory.
  string uri = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uri = true
  ];

  // What the link is, section 2.6.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.3>. Optional, and the only
  // registered value is "contact".
  LinkKind kind = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).enum.defined_only = true
  ];

  // The media type of the resource, RFC 6838 <https://www.rfc-editor.org/rfc/rfc6838.html>, section 2.6.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.3>.
  string media_type = 3 [(google.api.field_behavior) = OPTIONAL];

  // When this link is used, section 2.6.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.3>.
  repeated Context contexts = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // Preference, section 1.5.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.3>.
  int32 pref = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // A human-readable label, section 1.5.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.2>.
  string label = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Media is one entry of the Card "media" property, RFC 9553 section 2.6.4 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.4>.
//
// vCard's PHOTO (RFC 6350 section 6.2.4 <https://www.rfc-editor.org/rfc/rfc6350.html#section-6.2.4>), SOUND (section 6.7.5 <https://www.rfc-editor.org/rfc/rfc6350.html#section-6.7.5>)
// and LOGO (section 6.6.3 <https://www.rfc-editor.org/rfc/rfc6350.html#section-6.6.3>), which JSContact merges into one property
// keyed on `kind`.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.6.4.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.4
message Media {
  // The URI, section 2.6.4 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.4>. Mandatory. May be a "data:" URI, which
  // is how an inline image arrives -- note that makes a Card arbitrarily
  // large, so a consumer listing Cards should expect to page.
  string uri = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uri = true
  ];

  // What the media is, section 2.6.4 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.4>. Mandatory.
  MediaKind kind = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // The media type, RFC 6838 <https://www.rfc-editor.org/rfc/rfc6838.html>, section 2.6.4 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.4>, e.g. "image/jpeg".
  string media_type = 3 [(google.api.field_behavior) = OPTIONAL];

  // When this media is used, section 2.6.4 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.4>.
  repeated Context contexts = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // Preference, section 1.5.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.3>.
  int32 pref = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // A human-readable label, section 1.5.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.2>.
  string label = 6 [(google.api.field_behavior) = OPTIONAL];
}

// CryptoKey is one entry of the Card "cryptoKeys" property, RFC 9553
// section 2.6.1 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.1>.
//
// vCard's KEY, RFC 6350 section 6.8.1 <https://www.rfc-editor.org/rfc/rfc6350.html#section-6.8.1>.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.6.1.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.1
message CryptoKey {
  // The URI, section 2.6.1 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.1>. Mandatory. Often a "data:" URI carrying
  // the key itself.
  string uri = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uri = true
  ];

  // The media type, RFC 6838 <https://www.rfc-editor.org/rfc/rfc6838.html>, section 2.6.1 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.1>,
  // e.g. "application/pgp-keys".
  string media_type = 2 [(google.api.field_behavior) = OPTIONAL];

  // When this key is used, section 2.6.1 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.1>.
  repeated Context contexts = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // Preference, section 1.5.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.3>.
  int32 pref = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // A human-readable label, section 1.5.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.2>.
  string label = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Directory is one entry of the Card "directories" property, RFC 9553
// section 2.6.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.2>.
//
// vCard's SOURCE (RFC 6350 section 6.1.3 <https://www.rfc-editor.org/rfc/rfc6350.html#section-6.1.3>) and ORG-DIRECTORY
// (RFC 6715), merged and keyed on `kind`.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.6.2.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.2
message Directory {
  // The URI, section 2.6.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.2>. Mandatory.
  string uri = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.uri = true
  ];

  // What the directory reference is, section 2.6.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.2>. Mandatory.
  DirectoryKind kind = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // The media type, RFC 6838 <https://www.rfc-editor.org/rfc/rfc6838.html>, section 2.6.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.2>.
  string media_type = 3 [(google.api.field_behavior) = OPTIONAL];

  // When this directory is used, section 2.6.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.2>.
  repeated Context contexts = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).repeated.items.enum.defined_only = true
  ];

  // Preference, section 1.5.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.3>.
  int32 pref = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // Where this entry sits among the directory's entries, section 2.6.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.2>.
  int32 list_as = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // A human-readable label, section 1.5.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-1.5.2>.
  string label = 7 [(google.api.field_behavior) = OPTIONAL];
}

// LinkKind is a Link "kind", RFC 9553 section 2.6.3 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.3>.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.6.3.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.3
enum LinkKind {
  // Not specified. Section 2.6.3 permits an absent kind, meaning a link with
  // no stated purpose.
  LINK_KIND_UNSPECIFIED = 0;

  // A link to contact the entity by.
  LINK_KIND_CONTACT = 1;
}

// MediaKind is a Media "kind", RFC 9553 section 2.6.4 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.4>.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.6.4.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.4
enum MediaKind {
  // Not specified. Section 2.6.4 makes `kind` mandatory.
  MEDIA_KIND_UNSPECIFIED = 0;

  // A photograph. vCard's PHOTO.
  MEDIA_KIND_PHOTO = 1;

  // A sound, e.g. a name pronunciation. vCard's SOUND.
  MEDIA_KIND_SOUND = 2;

  // A logo. vCard's LOGO.
  MEDIA_KIND_LOGO = 3;
}

// DirectoryKind is a Directory "kind", RFC 9553 section 2.6.2 <https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.2>.
//
// Reference: RFC 9553 "JSContact: A JSON Representation of Contact Data", section 2.6.2.
// https://www.rfc-editor.org/rfc/rfc9553.html#section-2.6.2
enum DirectoryKind {
  // Not specified. Section 2.6.2 makes `kind` mandatory.
  DIRECTORY_KIND_UNSPECIFIED = 0;

  // A directory the entity is listed in. vCard's ORG-DIRECTORY.
  DIRECTORY_KIND_DIRECTORY = 1;

  // The directory entry this Card was sourced from. vCard's SOURCE.
  DIRECTORY_KIND_ENTRY = 2;
}
