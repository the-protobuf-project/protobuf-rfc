syntax = "proto3";

package protobuf.rfc7643.group.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "protobuf/rfc7643/group/v1/group.proto";
import "protobuf/rfc7643/group/v1/messages.proto";

option java_multiple_files = true;
option java_outer_classname = "ServiceProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc7643.group.v1";

// Groups manages groups in the canonical SCIM model.
//
// Membership is changed here, by updating the group's `members`, and not
// through the User resource -- RFC 7643 section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2> makes
// `User.groups` read-only for exactly that reason. One direction owns the
// edge, which is the same discipline protobuf.rfc4519.membership.v1 keeps
// with a separate resource.
//
// As with Users, there is **no IETF-specified conversion between SCIM and
// LDAP**; any mapping onto protobuf.rfc4519.group.v1 is this project's own.
service Groups {
  // Retrieves one group.
  //
  //   GET /v1/{name=groups/*}
  //
  // Safe and idempotent.
  //
  //   NOT_FOUND          no such group, or it is soft-deleted and `show_deleted` was not set
  //   INVALID_ARGUMENT   name does not match groups/*
  //   PERMISSION_DENIED  caller may not read it
  rpc GetGroup(GetGroupRequest) returns (Group) {
    option (google.api.http) = {get: "/v1/{name=groups/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists groups.
  //
  //   GET /v1/groups
  //
  // Paginated per AIP-158. Page tokens are opaque and may expire.
  //
  //   INVALID_ARGUMENT   malformed filter, or page_size out of range
  //   PERMISSION_DENIED  caller may not list this collection
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (google.api.http) = {get: "/v1/groups"};
  }

  // Creates a group.
  //
  //   POST /v1/groups
  //   body: the group itself
  //
  // Members may be supplied at creation, unlike the LDAP lineage where a
  // group and its memberships are two calls. Server-assigned fields on the
  // request body are ignored.
  //
  // Not idempotent. Retrying after a timeout may create a second group;
  // supply `group_id` if the caller needs retry safety.
  //
  //   ALREADY_EXISTS     that group_id is taken
  //   INVALID_ARGUMENT   a field violates its buf.validate constraint
  //   PERMISSION_DENIED  caller may not create here
  rpc CreateGroup(CreateGroupRequest) returns (Group) {
    option (google.api.http) = {
      post: "/v1/groups"
      body: "group"
    };
    option (google.api.method_signature) = "group,group_id";
  }

  // Updates a group.
  //
  //   PATCH /v1/{group.name=groups/*}
  //   body: the group itself
  //
  // A partial update: only fields named in `update_mask` are written.
  // Naming `members` replaces the list wholesale; see
  // UpdateGroupRequest.update_mask.
  //
  // Idempotent. Pass the `etag` read from Get to make the write conditional.
  //
  //   NOT_FOUND          no such group
  //   ABORTED            etag does not match the stored resource
  //   INVALID_ARGUMENT   mask names an unknown or immutable field
  //   PERMISSION_DENIED  caller may not modify it
  rpc UpdateGroup(UpdateGroupRequest) returns (Group) {
    option (google.api.http) = {
      patch: "/v1/{group.name=groups/*}"
      body: "group"
    };
    option (google.api.method_signature) = "group,update_mask";
  }

  // Deletes a group.
  //
  //   DELETE /v1/{name=groups/*}
  //
  // Soft delete: the group is marked deleted, disappears from List unless
  // `show_deleted` is set, and is purged at `expire_time`. Its members are
  // not deleted -- a membership is an edge, and removing the group removes
  // the edges with it.
  //
  //   NOT_FOUND          no such group
  //   ABORTED            etag does not match
  //   PERMISSION_DENIED  caller may not delete it
  rpc DeleteGroup(DeleteGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=groups/*}"};
    option (google.api.method_signature) = "name";
  }

  // Restores a soft-deleted group.
  //
  //   POST /v1/{name=groups/*}:undelete
  //
  // Valid only before `expire_time`; after that the group is gone and this
  // returns NOT_FOUND.
  //
  //   NOT_FOUND          no such group, or already purged
  //   ALREADY_EXISTS     the group is not deleted
  //   PERMISSION_DENIED  caller may not restore it
  rpc UndeleteGroup(UndeleteGroupRequest) returns (Group) {
    option (google.api.http) = {
      post: "/v1/{name=groups/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}
