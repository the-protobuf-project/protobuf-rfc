syntax = "proto3";

package protobuf.rfc7643.user.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "protobuf/rfc7643/user/v1/messages.proto";
import "protobuf/rfc7643/user/v1/user.proto";

option java_multiple_files = true;
option java_outer_classname = "ServiceProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc7643.user.v1";

// Users manages identities in the canonical SCIM model.
//
// **This is where identity data lives** under rule 14. The RFC 4519 packages
// keep their own CRUD and are not deprecated, but an LDAP entry saved through
// them is stored as a User here.
//
// Unlike the contact lineage, that conversion follows no specification. RFC
// 9555 maps vCard to JSContact element by element; **nothing equivalent
// exists for SCIM and LDAP**, so the mapping is this project's own invention
// and is labelled as such wherever it appears. A consumer relying on it is
// relying on a local decision, not on a standard.
//
// SCIM defines its own REST protocol in RFC 7644, which this service does not
// implement: these are the AIP-131..135 standard methods, and a SCIM front
// end maps onto them. The two disagree about pagination in particular -- see
// ListUsersRequest.page_token.
service Users {
  // Retrieves one user.
  //
  //   GET /v1/{name=users/*}
  //
  // Safe and idempotent. `password` is never returned, per RFC 7643
  // section 7.5 <https://www.rfc-editor.org/rfc/rfc7643.html#section-7.5>.
  //
  //   NOT_FOUND          no such user, or it is soft-deleted and `show_deleted` was not set
  //   INVALID_ARGUMENT   name does not match users/*
  //   PERMISSION_DENIED  caller may not read it
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/v1/{name=users/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists users.
  //
  //   GET /v1/users
  //
  // Paginated per AIP-158. Page tokens are opaque and may expire; do not
  // construct or store them.
  //
  //   INVALID_ARGUMENT   malformed filter, or page_size out of range
  //   PERMISSION_DENIED  caller may not list this collection
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/users"};
  }

  // Creates a user.
  //
  //   POST /v1/users
  //   body: the user itself
  //
  // Server-assigned fields on the request body are ignored: `name`, `uid`,
  // `etag` and the timestamps are set by the server regardless. `groups` is
  // OUTPUT_ONLY and is ignored too -- membership is changed through the Group
  // resource, per RFC 7643 section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2>.
  //
  // Not idempotent. Retrying after a timeout may create a second user;
  // supply `user_id` if the caller needs retry safety.
  //
  //   ALREADY_EXISTS     that user_id is taken, or `username` is not unique
  //   INVALID_ARGUMENT   a field violates its buf.validate constraint
  //   PERMISSION_DENIED  caller may not create here
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "user"
    };
    option (google.api.method_signature) = "user,user_id";
  }

  // Updates a user.
  //
  //   PATCH /v1/{user.name=users/*}
  //   body: the user itself
  //
  // A partial update: only fields named in `update_mask` are written. An
  // empty mask writes every mutable field, which will clear anything the
  // caller left unset -- pass a mask unless that is the intent.
  //
  // Deactivating a user is `active = false`, not a delete: RFC 7643
  // section 4.1 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1> keeps a deactivated account addressable, which is the
  // whole point of the attribute.
  //
  // Idempotent. Pass the `etag` read from Get to make the write conditional.
  //
  //   NOT_FOUND          no such user
  //   ABORTED            etag does not match the stored resource
  //   INVALID_ARGUMENT   mask names an unknown or immutable field
  //   PERMISSION_DENIED  caller may not modify it
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      patch: "/v1/{user.name=users/*}"
      body: "user"
    };
    option (google.api.method_signature) = "user,update_mask";
  }

  // Deletes a user.
  //
  //   DELETE /v1/{name=users/*}
  //
  // Soft delete: the user is marked deleted, disappears from List unless
  // `show_deleted` is set, and is purged at `expire_time`.
  //
  //   NOT_FOUND          no such user
  //   ABORTED            etag does not match
  //   PERMISSION_DENIED  caller may not delete it
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=users/*}"};
    option (google.api.method_signature) = "name";
  }

  // Restores a soft-deleted user.
  //
  //   POST /v1/{name=users/*}:undelete
  //
  // Valid only before `expire_time`; after that the user is gone and this
  // returns NOT_FOUND.
  //
  //   NOT_FOUND          no such user, or already purged
  //   ALREADY_EXISTS     the user is not deleted
  //   PERMISSION_DENIED  caller may not restore it
  rpc UndeleteUser(UndeleteUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/{name=users/*}:undelete"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}
