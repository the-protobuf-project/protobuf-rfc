syntax = "proto3";

package protobuf.rfc7643.user.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";

option java_multiple_files = true;
option java_outer_classname = "TypesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc7643.user.v1";

// Attribute is SCIM's default multi-valued attribute, RFC 7643 section 2.4 <https://www.rfc-editor.org/rfc/rfc7643.html#section-2.4>.
//
// One shape for emails, phone numbers, IMs, photos, entitlements, roles and
// certificates alike -- section 2.4 defines `value`, `display`, `type` and
// `primary` once and every multi-valued attribute reuses them. That uniformity
// is deliberate in SCIM and is why this is a single message rather than one
// per attribute, which is the opposite of the choice RFC 9553 forced in the
// JSContact package.
//
// Reference: RFC 7643 "System for Cross-domain Identity Management: Core Schema", section 2.4.
// https://www.rfc-editor.org/rfc/rfc7643.html#section-2.4
message Attribute {
  // The significant value, section 2.4 <https://www.rfc-editor.org/rfc/rfc7643.html#section-2.4>: the email address, the phone
  // number, the certificate.
  string value = 1 [(google.api.field_behavior) = OPTIONAL];

  // A human-readable label, section 2.4 <https://www.rfc-editor.org/rfc/rfc7643.html#section-2.4>. Section 2.4 gives it a
  // mutability of "immutable"; that is a server-side rule this schema states
  // rather than enforces.
  string display = 2 [(google.api.field_behavior) = OPTIONAL];

  // What the value is for, section 2.4 <https://www.rfc-editor.org/rfc/rfc7643.html#section-2.4>, e.g. "work", "home", "mobile".
  //
  // Free text rather than an enum: section 2.4 defines the sub-attribute
  // once, but each attribute that uses it declares its own canonical values --
  // "work"/"home"/"other" for emails, "work"/"home"/"mobile"/"fax"/"pager"
  // for phone numbers -- and section 7 lets a provider add more. One enum
  // could not be right for all of them, and one per attribute would defeat
  // the point of section 2.4.
  //
  // Named `attribute_type`, not `type`: `type` is too close to the resource
  // type in google.api.resource for a reader skimming both.
  string attribute_type = 3 [(google.api.field_behavior) = OPTIONAL];

  // Whether this is the preferred value, section 2.4 <https://www.rfc-editor.org/rfc/rfc7643.html#section-2.4>. At most one entry
  // in a given attribute may set it; that is a cross-field rule and is not
  // expressed as a buf.validate constraint, because no gate here checks CEL
  // -- see docs/conventions.md rule 12.
  bool primary = 4 [(google.api.field_behavior) = OPTIONAL];

  // A URI referencing the resource this value points at, section 2.4 <https://www.rfc-editor.org/rfc/rfc7643.html#section-2.4>.
  // SCIM spells this `$ref`, which is not a legal protobuf field name.
  string reference_uri = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.uri = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// Name is the User "name" attribute, RFC 7643 section 4.1.1 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.1>.
//
// Positional in the same way vCard's N is, and with the same limitation: five
// fixed slots plus a formatted string. SCIM predates RFC 9553's componentised
// model and has no equivalent, so a name that does not fit these slots loses
// structure here in a way it would not in a JSContact Card.
//
// Reference: RFC 7643 "System for Cross-domain Identity Management: Core Schema", section 4.1.1.
// https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.1
message Name {
  // The full name assembled for display, section 4.1.1 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.1>, including
  // all prefixes and suffixes.
  //
  // SCIM calls this `formatted`; renamed because a bare adjective names no
  // thing, and `display_name` is on AIP-122 <https://aip.dev/122>'s short allowlist for the
  // `_name` suffix.
  string display_name = 1 [(google.api.field_behavior) = OPTIONAL];

  // Family name, section 4.1.1 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.1>. SCIM: `familyName`.
  string family_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Given name, section 4.1.1 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.1>. SCIM: `givenName`.
  string given_name = 3 [(google.api.field_behavior) = OPTIONAL];

  // Middle name, section 4.1.1 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.1>. SCIM: `middleName`; renamed for
  // AIP-122 <https://aip.dev/122>'s `_name` suffix rule, which permits only display_name,
  // given_name and family_name.
  string middle_names = 4 [(google.api.field_behavior) = OPTIONAL];

  // Honorific prefix, e.g. "Ms", section 4.1.1 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.1>.
  string honorific_prefix = 5 [(google.api.field_behavior) = OPTIONAL];

  // Honorific suffix, e.g. "III", section 4.1.1 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.1>.
  string honorific_suffix = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Address is the User "addresses" attribute, RFC 7643 section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2>.
//
// Section 4.1.2 gives addresses their own sub-attributes rather than reusing
// Attribute's `value`, which is why this is a message of its own.
//
// Reference: RFC 7643 "System for Cross-domain Identity Management: Core Schema", section 4.1.2.
// https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2
message Address {
  // The full address as it should be written, newlines included,
  // section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2>. SCIM calls this `formatted`.
  string full_address = 1 [(google.api.field_behavior) = OPTIONAL];

  // Street address, section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2>. SCIM: `streetAddress`.
  string street_address = 2 [(google.api.field_behavior) = OPTIONAL];

  // City or locality, section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2>.
  string locality = 3 [(google.api.field_behavior) = OPTIONAL];

  // State or region, section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2>.
  string region = 4 [(google.api.field_behavior) = OPTIONAL];

  // Postal or ZIP code, section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2>. SCIM: `postalCode`.
  string postal_code = 5 [(google.api.field_behavior) = OPTIONAL];

  // ISO 3166-1 alpha-2 code, section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2>. SCIM calls this
  // `country`; AIP-143 <https://aip.dev/143> requires `region_code` for an ISO 3166-1 value.
  string region_code = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[A-Z]{2}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // What the address is for, e.g. "work" or "home", section 4.1.2 <https://www.rfc-editor.org/rfc/rfc7643.html#section-4.1.2>.
  string attribute_type = 7 [(google.api.field_behavior) = OPTIONAL];

  // Whether this is the preferred address, section 2.4 <https://www.rfc-editor.org/rfc/rfc7643.html#section-2.4>.
  bool primary = 8 [(google.api.field_behavior) = OPTIONAL];
}
