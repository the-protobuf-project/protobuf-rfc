syntax = "proto3";

package protobuf.rfc9073.resource.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "protobuf/rfc9073/resource/v1/resource.proto";

option java_multiple_files = true;
option java_outer_classname = "MessagesProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc9073.resource.v1";

// Request message for Resources.GetResource, AIP-131 <https://aip.dev/131>.
message GetResourceRequest {
  // Name of the resource to retrieve, "resources/{resource}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Resource",
    (buf.validate.field).string.pattern = "^resources/[^/]+$"
  ];
}

// Request message for Resources.ListResources, AIP-132 <https://aip.dev/132>.
message ListResourcesRequest {
  // Maximum resources to return. Defaults to 50, capped at 1000.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListResourcesResponse.next_page_token.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160 <https://aip.dev/160>.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // Include soft-deleted resources in the result. AIP-164 <https://aip.dev/164>.
  bool show_deleted = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for Resources.ListResources, AIP-132 <https://aip.dev/132>.
message ListResourcesResponse {
  // The resources on this page.
  repeated Resource resources = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for Resources.CreateResource, AIP-133 <https://aip.dev/133>.
message CreateResourceRequest {
  // The resource to create.
  Resource resource = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last segment of the resource name. The
  // server generates one when empty.
  string resource_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Resources.UpdateResource, AIP-134 <https://aip.dev/134>.
message UpdateResourceRequest {
  // The resource to update. Its name field identifies the resource.
  Resource resource = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for Resources.DeleteResource, AIP-135 <https://aip.dev/135>.
message DeleteResourceRequest {
  // Name of the resource to delete, "resources/{resource}".
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Resource",
    (buf.validate.field).string.pattern = "^resources/[^/]+$"
  ];
}

// Request message for Resources.UndeleteResource, AIP-164 <https://aip.dev/164>.
message UndeleteResourceRequest {
  // Name of the soft-deleted resource to restore.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "protobufrfc.dev/Resource",
    (buf.validate.field).string.pattern = "^resources/[^/]+$"
  ];
}
