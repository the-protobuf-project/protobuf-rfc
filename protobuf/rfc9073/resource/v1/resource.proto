syntax = "proto3";

package protobuf.rfc9073.resource.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "google/type/latlng.proto";
import "protobuf/rfc9073/resource/v1/types.proto";

option java_multiple_files = true;
option java_outer_classname = "ResourceProto";
option java_package = "io.github.theprotobufproject.protobuf.rfc9073.resource.v1";

// Resource is the VRESOURCE component, RFC 9073 section 7.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3>.
//
// Something bookable that is not a person and not a place: a projector, a
// meeting room, a parking bay, a minibus. RFC 5545 section 3.8.1.10 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.10> had a
// free-text RESOURCES property; section 7.3 is its structured replacement.
//
// A resource of its own, where `protobuf.rfc5545.event.v1.Resource` is a value
// object on an event. The two are the same component serving the two uses
// section 7.3 describes: the value object says *this booking needs a room*,
// and this says *here is the room*, addressable on its own so a catalogue can
// be listed, amended and retired independently of any booking. That is the
// test in `docs/adding-data.md` for a package rather than a field, and
// rule 8's for full CRUD. Neither replaces the other and both stay.
//
// A flat collection, "resources/{resource}", for the reason
// OrganizationalUnit is flat: section 7.3 defines the component's properties
// and says nothing about where it sits, so nesting it under a calendar or an
// organizational unit would assert a containment the RFC does not require.
//
// Reference: RFC 9073 "Event Publishing Extensions to iCalendar", section 7.3.
// https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3
message Resource {
  option (google.api.resource) = {
    type: "protobufrfc.dev/Resource"
    pattern: "resources/{resource}"
    singular: "resource"
    plural: "resources"
  };

  // Resource name, "resources/{resource}".
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^resources/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // Server-assigned unique id.
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4,
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // UID, RFC 5545 section 3.8.4.7 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.4.7>. Required by RFC 9073 section 7.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-7.3>.
  //
  // Interchange identity, distinct from uid above: it arrives inside an
  // imported .ics and must survive a round trip unchanged -- rule 9's
  // `<format>_uid` split, the same as Event.ical_uid.
  string ical_uid = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // NAME, RFC 7986 section 5.2 <https://www.rfc-editor.org/rfc/rfc7986.html#section-5.2>. What to call this resource, e.g. "Bay
  // L2-014" or "Boardroom".
  //
  // Named display_name, not name: AIP-122 <https://aip.dev/122> reserves `name` for the resource
  // identifier above.
  string display_name = 4 [(google.api.field_behavior) = OPTIONAL];

  // DESCRIPTION, RFC 5545 section 3.8.1.5 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.5>.
  string description = 5 [(google.api.field_behavior) = OPTIONAL];

  // RESOURCE-TYPE, RFC 9073 section 6.3 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.3>, e.g. "projector", "room",
  // "remote-conference-audio". Free text: section 6.3 points at an IANA
  // registry rather than a closed list, so an enum here would reject values
  // the registry adds later.
  repeated string resource_types = 6 [(google.api.field_behavior) = OPTIONAL];

  // GEO, RFC 5545 section 3.8.1.6 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.8.1.6>. Where the resource is.
  google.type.LatLng position = 7 [(google.api.field_behavior) = OPTIONAL];

  // STRUCTURED-DATA, RFC 9073 section 6.6 <https://www.rfc-editor.org/rfc/rfc9073.html#section-6.6>. Anything this schema does
  // not model, carried with a SCHEMA URI naming what it conforms to.
  repeated StructuredData structured_data = 8 [(google.api.field_behavior) = OPTIONAL];

  // The calendar this resource's bookings are kept on.
  //
  // Native: section 7.3 has no calendar property, because a VRESOURCE
  // published inside a VEVENT is already on the event's calendar. A
  // free-standing resource is not, and without this field nothing can ask
  // when it is busy -- RFC 5545 section 3.6.4 <https://www.rfc-editor.org/rfc/rfc5545.html#section-3.6.4>'s free/busy query is addressed
  // to a calendar. The field exists despite having no RFC property behind it,
  // the same trade OrganizationalUnit.organization records.
  string calendar = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "protobufrfc.dev/Calendar"
  ];

  // The organizational unit this resource belongs to, e.g. the car park a bay
  // is in.
  //
  // Native, for the reason above: left unset, a resource is undiscoverable
  // from the unit that operates it, and listing what a site has is the first
  // question a catalogue is asked.
  string organizational_unit = 10 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference).type = "protobufrfc.dev/OrganizationalUnit"
  ];

  // When the resource was created.
  google.protobuf.Timestamp create_time = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the resource was last modified.
  google.protobuf.Timestamp update_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Weak validator for optimistic concurrency, AIP-154 <https://aip.dev/154>. Pass it back in an
  // update or delete to make the write conditional: if the resource changed
  // since it was read, the request fails instead of overwriting.
  string etag = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the resource was soft-deleted, unset while it is live. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp delete_time = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a soft-deleted resource is purged for good. AIP-164 <https://aip.dev/164>.
  google.protobuf.Timestamp expire_time = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}
